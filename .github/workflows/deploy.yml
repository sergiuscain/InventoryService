name: build-and-deploy

on:
  push:
    branches: [prod]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sergiuscain/inventoryservice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push image
        run: docker push --all-tags ${{ env.IMAGE_NAME }}

   deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull and restart container
        run: |
          cd /home/server/путь_до_compose
          docker compose pull api
          docker compose up -d --no-deps api
          docker image prune -f